<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>German Verbs Learning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>German Verbs Learning</h1>
    <nav>
      <a href="#" id="home-link">Home</a>
      <a href="practice.html">Practice</a>
      <a href="grammar.html">Grammar</a>
    </nav>
  </header>

  <main>
    <section id="levels">
      <h2>Verb Levels</h2>
      <button class="level-btn" data-level="a1">A1</button>
      <button class="level-btn" data-level="a2">A2</button>
      <button class="level-btn" data-level="b1">B1</button>
      <button class="level-btn" data-level="b2">B2</button>
      <button class="level-btn" data-level="c1">C1</button>
    </section>

    <section id="verbs-display">
      <h2>Verbs</h2>
      <div id="verbs-list">
        <p>Select a level to display verbs.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 German Learning App</p>
  </footer>

  <script src="verbs/verbs_a1.js"></script>
  <script src="verbs/verbs_a2.js"></script>
  <script src="verbs/verbs_b1.js"></script>
  <script src="verbs/verbs_b2.js"></script>
  <script src="verbs/verbs_c1.js"></script>
  <script src="app.js"></script>

  <script>
    // Dynamically show verbs when a level button is clicked
    const levels = document.querySelectorAll('.level-btn');
    const verbsListDiv = document.getElementById('verbs-list');

    const verbsData = {
      a1: verbs_a1,
      a2: verbs_a2,
      b1: verbs_b1,
      b2: verbs_b2,
      c1: verbs_c1
    };

    levels.forEach(btn => {
      btn.addEventListener('click', () => {
        const level = btn.dataset.level;
        const verbs = verbsData[level];

        if (!verbs) return;

        verbsListDiv.innerHTML = ''; // clear previous verbs

        verbs.forEach(verb => {
          const verbDiv = document.createElement('div');
          verbDiv.className = 'verb';

          // Base verb and derived
          let derivedText = verb.derived ? `<strong>Forms:</strong> ${verb.derived.join(', ')}` : '';
          let prepositionsText = verb.prepositions ? `<strong>Prepositions:</strong> ${verb.prepositions.join(', ')}` : '';

          // Variants if any
          let variantsText = '';
          if (verb.variants) {
            variantsText = '<ul>';
            verb.variants.forEach(variant => {
              let vPreps = variant.prepositions ? ` (Prepositions: ${variant.prepositions.join(', ')})` : '';
              variantsText += `<li><strong>${variant.base}</strong> – ${variant.translations.join(', ')}${vPreps}</li>`;
            });
            variantsText += '</ul>';
          }

          verbDiv.innerHTML = `
            <h3>${verb.base}</h3>
            <p><strong>Past:</strong> ${verb.past} | <strong>Participle:</strong> ${verb.participle}</p>
            <p><strong>Translation:</strong> ${verb.translations.join(', ')}</p>
            <p>${prepositionsText}</p>
            <p>${derivedText}</p>
            ${variantsText}
            <p><strong>Examples:</strong></p>
            <ul>
              ${verb.examples.map(e => `<li>${e}</li>`).join('')}
            </ul>
          `;

          verbsListDiv.appendChild(verbDiv);
        });
      });
    });
  </script>
</body>
</html>
